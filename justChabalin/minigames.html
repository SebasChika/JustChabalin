<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="imagenes/anaIcon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/minigames.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuegos</title>
</head>

<body>
    <audio id="logro" src="audio/logro.mp3"></audio>
    <audio id="selected" src="audio/confirmar.mp3"></audio>
    <audio loop id="minigames" src="audio/songMinigames.mp3"></audio>
    <div id="negro"></div>
    <div id="volver"><img src="imagenes/chabalinPedia/volver.png"></div>

    <main>
        <div id="archivement">
            <img src="imagenes/menu/rompecabezas.png">
            <div id="derecha">
                <h2 id="textoLogro">¡Que tranquilidad!</h2>
                <h2 id="contextoLogro">Consigue el chabalin Tranquilo</h2>
            </div>
        </div>
        <div id="contenidoo">
            <div id="top">
                <div class="cada" id="game1">
                    <img src="imagenes/minijuegos/portada1.png">
                    <h1>flappy Chabal</h1>
                </div>

                <div class="cada" id="game2">
                    <img src="imagenes/minijuegos/portada2.png">
                    <h1>Clickin Chabal</h1>
                </div>

                <div class="cada" id="game3">
                    <img src="imagenes/minijuegos/portada3.png">
                    <h1>Timer Chabal</h1>
                </div>
            </div>
            <div id="bottom">

                <div class="cada" id="game4">
                    <img src="imagenes/minijuegos/portada4.png">
                    <h1>Concentraito</h1>
                </div>

                <div class="cada" id="game5">
                    <img src="imagenes/minijuegos/portada5.png">
                    <h1>Come chabal</h1>
                </div>

                <div class="cada" id="game6">
                    <img src="imagenes/minijuegos/portada6.png">
                    <h1>Pesca chabal</h1>
                </div>
            </div>
        </div>
        <img id="frivThing" src="imagenes/minijuegos/jstChabalinGame.png">
    </main>


    <script src="js/minigames.js"></script>
</body>

</html>
